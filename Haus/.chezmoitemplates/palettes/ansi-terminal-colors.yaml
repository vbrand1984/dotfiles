#
# This file contains ANSI terminal color codes
#
# See: https://gist.github.com/JBlond/2fea43a3049b38287e5e9cefc87b2124
# See: https://misc.flogisoft.com/bash/tip_colors_and_formatting
# 
# chezmoi variable to store relative path to this template: .tmpl.palette.ansiTerminalColors
#
---

# Regular foreground colors
black:    '\033[0;30m'
red:      '\033[0;31m'
green:    '\033[0;32m'
yellow:   '\033[0;33m'
blue:     '\033[0;34m'
magenta:  '\033[0;35m'
cyan:     '\033[0;36m'
white:    '\033[0;37m'

# Reset to normal color
reset:    '\033[0m'

# Bold foreground colors
bold:
  black:    '\033[1;30m'
  red:      '\033[1;31m'
  green:    '\033[1;32m'
  yellow:   '\033[1;33m'
  blue:     '\033[1;34m'
  magenta:  '\033[1;35m'
  cyan:     '\033[1;36m'
  white:    '\033[1;37m'

# Underline foreground colors
underline:
  black:    '\033[4;30m'
  red:      '\033[4;31m'
  green:    '\033[4;32m'
  yellow:   '\033[4;33m'
  blue:     '\033[4;34m'
  magenta:  '\033[4;35m'
  cyan:     '\033[4;36m'
  white:    '\033[4;37m'

esc:
  # Escape sequences for bash PS1
  bashStart: '\['
  bashEnd:   '\]'

  # Raw terminal ANSI escape sequences
  start: '\001'
  end:   '\002'

...
